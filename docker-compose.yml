version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: servipy-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-servipy}
      MYSQL_USER: ${MYSQL_USER:-servipy_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-servipy_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

volumes:
  mysql_data:
