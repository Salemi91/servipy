version: '3.8'

services:
  # --- Base de Datos MySQL 8 ---
  mysql:
    image: mysql:8.0
    container_name: servipy-mysql
    restart: unless-stopped
    # Descomenta 'ports' solo si necesitas acceso remoto a la BD desde fuera de la EC2
    # ports:
    #   - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend Spring Boot (Desde Docker Hub) ---
  backend:
    # image: ${DOCKER_USER}/backend-app:latest
    build:
      context: ./backend        # Ruta a la carpeta del proyecto Java
      dockerfile: Dockerfile
    container_name: servipy-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - app-network

  # --- Frontend Angular 19 + Nginx (Desde Docker Hub) ---
  frontend:
    # image: ${DOCKER_USER}/frontend-app:latest
    build:
      context: ./frontend       # Ruta a la carpeta del proyecto Angular
      dockerfile: Dockerfile
    container_name: servipy-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge