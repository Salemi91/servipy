<div class="flex flex-col items-center justify-center py-16 text-center">
  <svg
    class="mb-4 h-16 w-16 text-gray-300"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="1.5"
      d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"
    />
  </svg>

  <p *ngIf="!hasFilters" class="text-base text-gray-500">
    No hay profesionales disponibles en este momento.
  </p>

  <ng-container *ngIf="hasFilters">
    <p class="text-base text-gray-500 mb-4">
      No se encontraron profesionales con los criterios seleccionados.
    </p>
    <button
      type="button"
      (click)="clearFilters.emit()"
      class="min-h-[44px] min-w-[44px] rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
    >
      Limpiar filtros
    </button>
  </ng-container>
</div>
