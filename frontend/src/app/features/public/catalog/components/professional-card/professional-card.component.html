<a
  [routerLink]="['/profesionales', professional.id]"
  class="block rounded-lg border border-gray-200 bg-white p-4 shadow-sm transition hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500"
>
  <div class="flex items-center gap-3 mb-3">
    <img
      *ngIf="professional.photoUrl"
      [src]="professional.photoUrl"
      [alt]="professional.name"
      class="h-12 w-12 rounded-full object-cover"
    />
    <div
      *ngIf="!professional.photoUrl"
      class="flex h-12 w-12 items-center justify-center rounded-full bg-blue-100 text-blue-600 font-semibold text-lg"
    >
      {{ professional.name.charAt(0) }}
    </div>
    <div class="min-w-0 flex-1">
      <h3 class="text-base font-semibold text-gray-900 truncate">
        {{ professional.name }}
      </h3>
      <p class="text-sm text-gray-500 truncate">
        {{ professional.professionalTitle }}
      </p>
    </div>
  </div>

  <p class="text-sm text-gray-600 mb-3 line-clamp-3">
    {{ professional.description }}
  </p>

  <div class="flex flex-wrap items-center gap-2 text-xs text-gray-500">
    <span
      class="inline-flex items-center rounded-full bg-blue-50 px-2 py-0.5 text-blue-700"
    >
      {{ professional.categoryName }}
    </span>
    <span *ngIf="professional.cityName">📍 {{ professional.cityName }}</span>
    <span>{{ professional.availability }}</span>
  </div>

  <div class="mt-3 text-right">
    <span
      *ngIf="professional.referencePrice"
      class="text-sm font-medium text-green-700"
    >
      Desde {{ professional.referencePrice | number : '1.0-0' }} PYG
    </span>
  </div>
</a>
