<div
  class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
  aria-label="Cargando profesionales"
  role="status"
>
  <div
    *ngFor="let i of [1, 2, 3, 4, 5, 6]"
    class="animate-pulse rounded-lg border border-gray-200 bg-white p-4"
  >
    <div class="flex items-center gap-3 mb-3">
      <div class="h-12 w-12 rounded-full bg-gray-200"></div>
      <div class="flex-1 space-y-2">
        <div class="h-4 w-3/4 rounded bg-gray-200"></div>
        <div class="h-3 w-1/2 rounded bg-gray-200"></div>
      </div>
    </div>
    <div class="space-y-2">
      <div class="h-3 w-full rounded bg-gray-200"></div>
      <div class="h-3 w-5/6 rounded bg-gray-200"></div>
    </div>
    <div class="mt-3 flex gap-2">
      <div class="h-5 w-16 rounded-full bg-gray-200"></div>
      <div class="h-5 w-20 rounded-full bg-gray-200"></div>
    </div>
  </div>
</div>
