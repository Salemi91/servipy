<div class="relative w-full">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    (input)="onInput()"
    placeholder="Buscar profesionales..."
    aria-label="Buscar profesionales"
    class="w-full min-h-[44px] rounded-lg border border-gray-300 bg-white px-4 py-2 pl-10 text-sm text-gray-900 placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
  />
  <svg
    class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
    />
  </svg>
</div>
