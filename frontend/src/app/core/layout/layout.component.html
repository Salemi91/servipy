<div class="flex min-h-screen flex-col">
  <!-- Header -->
  <header class="bg-white shadow-sm">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
      <a routerLink="/" class="text-xl font-bold text-indigo-600">ServiPy</a>
      <nav class="flex items-center space-x-4">
        @if (authService.currentUser()) {
          <span class="text-sm text-gray-600">{{ authService.currentUser()?.name }}</span>
          <button
            (click)="authService.logout()"
            class="rounded-md bg-gray-100 px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-200">
            Salir
          </button>
        } @else {
          <a routerLink="/login" class="text-sm font-medium text-gray-600 hover:text-indigo-600">Iniciar sesión</a>
          <a routerLink="/register" class="rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-indigo-700">Registrarse</a>
        }
      </nav>
    </div>
  </header>

  <!-- Main content -->
  <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-6">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="border-t bg-white py-4 text-center text-sm text-gray-500">
    ServiPy &copy; 2026
  </footer>
</div>
