# Perfil para tests automatizados.
# H2 en memoria: no depende de MySQL ni de variables de entorno externas.

spring:
  datasource:
    url: jdbc:h2:mem:servipy_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

logging:
  level:
    py.com.servipy: DEBUG

app:
  cors:
    allowed-origin: http://localhost:4200
  jwt:
    # Secreto fijo de test: mantiene los tests deterministas y sin dependencias del entorno.
    secret: servipy-test-secret-key-for-automated-tests-min-32-bytes
    expiration-minutes: 30
